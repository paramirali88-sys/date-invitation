
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوت‌نامه ویژه</title>
<style>
body {
  margin: 0;
  font-family: Tahoma, sans-serif;
  background: linear-gradient(135deg,#ff758c,#ff7eb3);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.card {
  background: white;
  padding: 40px 25px;
  border-radius: 25px;
  width: 85%;
  max-width: 380px;
  box-shadow: 0 10px 35px #0003;
}
h1 { color: #e84373; }
p { color: #555; line-height: 2; }
button {
  background: #e84373;
  color: white;
  border: 0;
  padding: 14px 30px;
  border-radius: 12px;
  font-size: 17px;
  cursor: pointer;
}
#answer {
  color: #e84373;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="card">
  <h1>💌 دعوت‌نامه ویژه</h1>
  <h2>یه دعوت قشنگ برات دارم!</h2>
  <p>
    دوست دارم یه روز خوب رو کنار هم بگذرونیم.
    <br>
    نظرت چیه؟ 🌸
  </p>
  <p>📅 تاریخ: به‌زودی</p>
  <p>📍 مکان: با هماهنگی همدیگه</p>
  <button onclick="document.getElementById('answer').innerText='ممنون از پاسخت! ❤️'">
    قبول دارم ❤️
  </button>
  <p id="answer"></p>
</div>
</body>
</html>
